name: ORES Chat API peer-authority acceptance
description: Execute sibling-org parity checks without changing either authored contract authority.
author: ORESoftware

inputs:
  source-root:
    description: Production repository checkout root.
    required: false
    default: .
  typespec:
    description: TypeSpec entry file relative to source-root.
    required: false
    default: contracts/typespec/main.tsp
  schema:
    description: Independently authored JSON Schema directory relative to source-root.
    required: false
    default: contracts/json-schema
  instances:
    description: Independently maintained instance corpus relative to source-root.
    required: false
    default: contracts/fixtures
  evidence-root:
    description: Isolated evidence directory relative to source-root.
    required: false
    default: .ores-chat-test/api-contract-e2e
  run-rust-tests:
    description: Run the production Rust contract parity tests.
    required: false
    default: "true"
  int64-strategy:
    description: Explicit wire encoding for int64/uint64; select number only for independently authored JSON-number contracts.
    required: false
    default: string

outputs:
  receipt:
    description: Path to the sibling-org acceptance receipt.
    value: ${{ steps.outputs.outputs.receipt }}
  contract_ir:
    description: Path to the parity-approved, non-authoritative Contract IR.
    value: ${{ steps.outputs.outputs.contract_ir }}

runs:
  using: composite
  steps:
    - name: Snapshot independently authored inputs
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TYPESPEC_INPUT: ${{ inputs.typespec }}
        SCHEMA_INPUT: ${{ inputs.schema }}
        INSTANCES_INPUT: ${{ inputs.instances }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
        RUN_RUST_TESTS: ${{ inputs.run-rust-tests }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/contract_guard.py" snapshot \
          --source-root "${SOURCE_ROOT}" \
          --typespec "${TYPESPEC_INPUT}" \
          --schema "${SCHEMA_INPUT}" \
          --instances "${INSTANCES_INPUT}" \
          --evidence-root "${EVIDENCE_ROOT}" \
          --manifest "${EVIDENCE_ROOT}/authored-inputs.json" \
          --run-rust-tests "${RUN_RUST_TESTS}"

    - name: Compare TypeSpec A, generated JSON Schema B, and JSON Schema A
      uses: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc
      with:
        typespec: ${{ inputs.source-root }}/${{ inputs.typespec }}
        schema: ${{ inputs.source-root }}/${{ inputs.schema }}
        instances: ${{ inputs.source-root }}/${{ inputs.instances }}
        report: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/validator-report.json
        sarif: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/validator.sarif
        contract_ir: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/contract-ir.json
        output_dir: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/generated
        int64_strategy: ${{ inputs.int64-strategy }}
        quiet: "false"

    - name: Require a parity-approved, non-authoritative Contract IR
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
      run: |
        set -euo pipefail
        node - "${SOURCE_ROOT%/}/${EVIDENCE_ROOT#/}/validator-report.json" "${SOURCE_ROOT%/}/${EVIDENCE_ROOT#/}/contract-ir.json" <<'NODE'
        const { readFileSync } = require('node:fs');
        const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
        const ir = JSON.parse(readFileSync(process.argv[3], 'utf8'));
        if (report.schema !== 'ores.typespec-json-schema-validator.report/v1') throw new Error('unexpected TJSV report schema');
        if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) throw new Error('TJSV parity did not pass');
        if (report.authorities?.precedence !== 'none') throw new Error('authority precedence is forbidden');
        if (report.authorities?.typespec?.authority !== 'independently-authored') throw new Error('TypeSpec authority role drift');
        if (report.authorities?.jsonSchema?.authority !== 'independently-authored') throw new Error('JSON Schema authority role drift');
        if (report.authorities?.typespec?.generatedJsonSchemaRole !== 'comparison-evidence-only') throw new Error('generated witness role drift');
        if (ir.schema !== 'ores.typespec-json-schema-validator.contract-ir/v1') throw new Error('unexpected Contract IR schema');
        if (ir.status !== 'passed' || ir.admissible !== true) throw new Error('Contract IR is not admissible');
        if (ir.role !== 'downstream-derived-parity-artifact' || ir.editableAuthority !== false) throw new Error('Contract IR authority boundary drift');
        NODE

    - name: Execute production Rust parity slices
      if: inputs.run-rust-tests == 'true'
      shell: bash
      working-directory: ${{ inputs.source-root }}
      run: |
        set -euo pipefail
        cargo test --locked \
          --test chat_contract_parity \
          --test support_contract_parity \
          --test parity_slices

    - name: Verify immutability and publish sibling-org receipt
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TYPESPEC_INPUT: ${{ inputs.typespec }}
        SCHEMA_INPUT: ${{ inputs.schema }}
        INSTANCES_INPUT: ${{ inputs.instances }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
        RUN_RUST_TESTS: ${{ inputs.run-rust-tests }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/contract_guard.py" verify \
          --source-root "${SOURCE_ROOT}" \
          --typespec "${TYPESPEC_INPUT}" \
          --schema "${SCHEMA_INPUT}" \
          --instances "${INSTANCES_INPUT}" \
          --evidence-root "${EVIDENCE_ROOT}" \
          --manifest "${EVIDENCE_ROOT}/authored-inputs.json" \
          --report "${EVIDENCE_ROOT}/validator-report.json" \
          --sarif "${EVIDENCE_ROOT}/validator.sarif" \
          --receipt "${EVIDENCE_ROOT}/receipt.json" \
          --run-rust-tests "${RUN_RUST_TESTS}"

    - name: Expose evidence paths
      id: outputs
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
      run: |
        set -euo pipefail
        root="${SOURCE_ROOT%/}/${EVIDENCE_ROOT#/}"
        printf 'receipt=%s/receipt.json\n' "$root" >> "${GITHUB_OUTPUT}"
        printf 'contract_ir=%s/contract-ir.json\n' "$root" >> "${GITHUB_OUTPUT}"
