name: ORES Chat API peer-authority acceptance
description: Execute sibling-org parity checks without changing either authored contract authority.
author: ORESoftware

inputs:
  source-root:
    description: Production repository checkout root.
    required: false
    default: .
  typespec:
    description: TypeSpec entry file relative to source-root.
    required: false
    default: contracts/typespec/main.tsp
  schema:
    description: Independently authored JSON Schema directory relative to source-root.
    required: false
    default: contracts/json-schema
  instances:
    description: Independently maintained instance corpus relative to source-root.
    required: false
    default: contracts/fixtures
  evidence-root:
    description: Isolated evidence directory relative to source-root.
    required: false
    default: .ores-chat-test/api-contract-e2e
  run-rust-tests:
    description: Run the production Rust contract parity tests.
    required: false
    default: "true"

outputs:
  receipt:
    description: Path to the sibling-org acceptance receipt.
    value: ${{ steps.outputs.outputs.receipt }}

runs:
  using: composite
  steps:
    - name: Snapshot independently authored inputs
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TYPESPEC_INPUT: ${{ inputs.typespec }}
        SCHEMA_INPUT: ${{ inputs.schema }}
        INSTANCES_INPUT: ${{ inputs.instances }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
        RUN_RUST_TESTS: ${{ inputs.run-rust-tests }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/contract_guard.py" snapshot \
          --source-root "${SOURCE_ROOT}" \
          --typespec "${TYPESPEC_INPUT}" \
          --schema "${SCHEMA_INPUT}" \
          --instances "${INSTANCES_INPUT}" \
          --evidence-root "${EVIDENCE_ROOT}" \
          --manifest "${EVIDENCE_ROOT}/authored-inputs.json" \
          --run-rust-tests "${RUN_RUST_TESTS}"

    - name: Compare TypeSpec A, generated JSON Schema B, and JSON Schema A
      uses: ORESoftware/typespec-json-schema-validator@282883afc4645f3303ed746bdb1e1571475724c5
      with:
        typespec: ${{ inputs.source-root }}/${{ inputs.typespec }}
        schema: ${{ inputs.source-root }}/${{ inputs.schema }}
        instances: ${{ inputs.source-root }}/${{ inputs.instances }}
        report: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/validator-report.json
        sarif: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/validator.sarif
        output_dir: ${{ inputs.source-root }}/${{ inputs.evidence-root }}/generated
        quiet: "false"

    - name: Execute production Rust parity slices
      if: inputs.run-rust-tests == 'true'
      shell: bash
      working-directory: ${{ inputs.source-root }}
      run: |
        set -euo pipefail
        cargo test --locked \
          --test chat_contract_parity \
          --test support_contract_parity \
          --test parity_slices

    - name: Verify immutability and publish sibling-org receipt
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TYPESPEC_INPUT: ${{ inputs.typespec }}
        SCHEMA_INPUT: ${{ inputs.schema }}
        INSTANCES_INPUT: ${{ inputs.instances }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
        RUN_RUST_TESTS: ${{ inputs.run-rust-tests }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/scripts/contract_guard.py" verify \
          --source-root "${SOURCE_ROOT}" \
          --typespec "${TYPESPEC_INPUT}" \
          --schema "${SCHEMA_INPUT}" \
          --instances "${INSTANCES_INPUT}" \
          --evidence-root "${EVIDENCE_ROOT}" \
          --manifest "${EVIDENCE_ROOT}/authored-inputs.json" \
          --report "${EVIDENCE_ROOT}/validator-report.json" \
          --sarif "${EVIDENCE_ROOT}/validator.sarif" \
          --receipt "${EVIDENCE_ROOT}/receipt.json" \
          --run-rust-tests "${RUN_RUST_TESTS}"

    - name: Expose evidence path
      id: outputs
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        EVIDENCE_ROOT: ${{ inputs.evidence-root }}
      run: |
        set -euo pipefail
        printf 'receipt=%s/%s/receipt.json\n' \
          "${SOURCE_ROOT%/}" "${EVIDENCE_ROOT#/}" >> "${GITHUB_OUTPUT}"
