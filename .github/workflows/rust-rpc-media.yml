name: Rust RPC Accept media boundary
on:
  pull_request:
    paths:
      - "rust-cert/**"
      - ".github/workflows/rust-rpc-media.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  media-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Assert source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git rev-parse HEAD:rust-cert/src/lib.rs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-cert/Cargo.toml --all -- --check
      - name: Execute Rust RPC acceptance and negative mutation tests
        run: cargo test --manifest-path rust-cert/Cargo.toml --all-targets
