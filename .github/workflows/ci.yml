name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-contract-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate organization suite declaration
        uses: ores-chat-test/.github@45aac3517015fdfe2eee74ac53a6ae7fc397cf04
        with:
          suite-path: suite.json

      - name: Install Node.js for the pinned TypeSpec toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run guard unit tests
        run: python3 -m unittest -v tests/test_contract_guard.py

      - name: Execute convergent peer-authority fixture
        id: convergent
        continue-on-error: true
        uses: ./
        with:
          source-root: testdata/equivalent
          run-rust-tests: "false"

      - name: Prepare deliberate declaration drift
        if: steps.convergent.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          drift_root="$(mktemp -d "$PWD/tmp/contract-drift.XXXXXX")"
          cp -R testdata/equivalent/contracts "$drift_root/contracts"
          printf 'ORES_CHAT_DRIFT_ROOT=%s\n' "$drift_root" >> "$GITHUB_ENV"
          export ORES_CHAT_DRIFT_ROOT="$drift_root"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["ORES_CHAT_DRIFT_ROOT"]) / "contracts/json-schema/authored.schema.json"
          document = json.loads(path.read_text(encoding="utf-8"))
          document["$defs"]["Widget"]["required"].append("count")
          path.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute drifted peer-authority fixture
        if: steps.convergent.outcome == 'success'
        id: drift
        continue-on-error: true
        uses: ./
        with:
          source-root: ${{ env.ORES_CHAT_DRIFT_ROOT }}
          run-rust-tests: "false"

      - name: Execute explicit JSON-number uint64 fixture
        id: numeric
        continue-on-error: true
        uses: ./
        with:
          source-root: testdata/numeric
          run-rust-tests: "false"
          int64-strategy: number

      - name: Reject a string encoding for an authored numeric contract
        id: wrong-encoding
        continue-on-error: true
        uses: ./
        with:
          source-root: testdata/numeric
          evidence-root: .ores-chat-test/wrong-encoding
          run-rust-tests: "false"
          int64-strategy: string

      - name: Require positive-pass and negative-fail outcomes
        if: always()
        env:
          CONVERGENT_OUTCOME: ${{ steps.convergent.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          NUMERIC_OUTCOME: ${{ steps.numeric.outcome }}
          WRONG_ENCODING_OUTCOME: ${{ steps.wrong-encoding.outcome }}
        run: |
          set -euo pipefail
          test "${CONVERGENT_OUTCOME}" = success
          test "${DRIFT_OUTCOME}" = failure
          test "${NUMERIC_OUTCOME}" = success
          test "${WRONG_ENCODING_OUTCOME}" = failure

      - name: Require semantic rejection, not a broken compiler or action
        if: always()
        run: |
          set -euo pipefail
          jq -e '.status == "stopped_for_evaluation" and .differential.summary.divergences > 0' \
            "$ORES_CHAT_DRIFT_ROOT/.ores-chat-test/api-contract-e2e/validator-report.json"
          jq -e '.status == "stopped_for_evaluation" and .differential.summary.divergences > 0' \
            testdata/numeric/.ores-chat-test/wrong-encoding/validator-report.json
          git diff --exit-code -- testdata

      - name: Retain sibling-org evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-contract-e2e-${{ github.run_id }}
          path: |
            testdata/equivalent/.ores-chat-test/api-contract-e2e
            testdata/numeric/.ores-chat-test
            tmp/contract-drift.*/.ores-chat-test/api-contract-e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
