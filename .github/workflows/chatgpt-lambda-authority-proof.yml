name: chatgpt lambda authority proof
on:
  push:
    branches: [chatgpt/lambda-authority-proof-20260923]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out current ores-lambda authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-lambda
          ref: cc7e5da3b42a75f8b172d85bf13a0c2844c2d431
          path: upstream-ores-lambda
          persist-credentials: false
      - name: Materialize exact ORES Chat authority fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/config fixture/contracts fixture/conformance fixture/src/bin
          cat > fixture/.ores-lambda.toml <<'EOF'
          schema_version = "ores.lambda.manifest/v1"
          [repository]
          organization = "ores-chat"
          repository = "ores-chat-lambdas"
          [middleware]
          required = true
          package = "oresoftware/ores-middleware"
          config_path = ".ores-mw.toml"
          execution = "invocation"
          fail_closed = true
          [local_ingress]
          enabled = true
          bind = "127.0.0.1:8088"
          request_timeout_ms = 10000
          max_request_body_bytes = 262144
          max_response_body_bytes = 8388608
          max_attempts = 2
          [[functions]]
          id = "worker-http"
          entrypoint = "oci-http"
          trigger = "http"
          middleware_required = true
          [functions.source]
          kind = "custom"
          repository = "ores-chat-lambdas"
          path = "src/bin/oci-http.rs"
          [functions.local]
          working_dir = "ores-chat-lambdas"
          command = ["cargo", "run", "--locked", "--bin", "oci-http"]
          bind_env = "LAMBDA_BIND"
          host = "127.0.0.1"
          start_port = 19200
          replicas = 2
          [functions.http]
          ingress_path_prefix = "/__ores/lambda/worker"
          methods = ["POST"]
          hosts = []
          priority = 100
          preserve_host = false
          timeout_ms = 10000
          [[functions]]
          id = "worker-direct"
          entrypoint = "ores-chat-lambdas"
          trigger = "direct"
          middleware_required = true
          [functions.source]
          kind = "custom"
          repository = "ores-chat-lambdas"
          path = "src/main.rs"
          [[functions]]
          id = "health-direct"
          entrypoint = "health"
          trigger = "direct"
          middleware_required = true
          [functions.source]
          kind = "custom"
          repository = "ores-chat-lambdas"
          path = "src/bin/health.rs"
          EOF
          cat > fixture/.ores-mw.toml <<'EOF'
          schema_version = 1
          repository_mode = "server-only"
          default_target = "portable-adapters"
          [[targets]]
          name = "portable-adapters"
          role = "server"
          roots = ["src"]
          middleware = "stack"
          stack_config = "config/ores-middleware.stack.json"
          EOF
          cat > fixture/config/ores-middleware.stack.json <<'EOF'
          {"contractVersion":"1.0.0","environment":"development","requiredCapabilities":["request-context","panic-recovery","request-id","trace-context","structured-logging","metrics-red","deadline-timeout","payload-limit"],"settings":{"timeoutMs":5000,"maxBodyBytes":262144}}
          EOF
          cat > fixture/Cargo.toml <<'EOF'
          [package]
          name = "ores-chat-lambdas"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.88"
          publish = false
          [dependencies]
          lambda_runtime = "=1.3.0"
          flags2env = { git = "https://github.com/flags-2-env/flags-2-env", rev = "333c2ace93c362d274171ab0e0edf613d96a8e59", package = "flags2env" }
          next_loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b" }
          ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "e8cd29091f9dc6f8441b9493c40637b4273d0682", default-features = false }
          serde = { version = "=1.0.220", features = ["derive"] }
          serde_json = "=1.0.151"
          tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
          thiserror = "=2.0.16"
          [[bin]]
          name = "health"
          path = "src/bin/health.rs"
          EOF
          cat > fixture/.zpkg.toml <<'EOF'
          [package]
          org = "ores-chat"
          name = "ores-chat-lambdas"
          version = "0.1.0"
          [dependencies]
          "oresoftware/ores-middleware" = "^0.1.0"
          [targets.rust]
          dir = "."
          adapter = "rust"
          [targets.contracts]
          dir = "contracts"
          adapter = "files"
          [targets.conformance]
          dir = "conformance"
          adapter = "files"
          EOF
          printf '%s\n' '# contract boundary' > fixture/contracts/README.md
          printf '%s\n' '# conformance boundary' > fixture/conformance/README.md
          printf '%s\n' 'fn main() {}' > fixture/src/main.rs
          printf '%s\n' 'fn main() {}' > fixture/src/bin/health.rs
          printf '%s\n' 'fn main() {}' > fixture/src/bin/oci-http.rs
      - name: Generate exact dependency lock
        run: cargo generate-lockfile --manifest-path fixture/Cargo.toml
      - name: Compile exact dependency graph locked
        run: cargo check --manifest-path fixture/Cargo.toml --all-targets --locked
      - name: Admit manifest and repository
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path upstream-ores-lambda/Cargo.toml -p ores-lambda-conformance --bin ores-lambda -- check fixture/.ores-lambda.toml
          cargo run --quiet --manifest-path upstream-ores-lambda/Cargo.toml -p ores-lambda-conformance --bin ores-lambda -- check-repo fixture
          cargo run --quiet --manifest-path upstream-ores-lambda/Cargo.toml -p ores-lambda-conformance --bin ores-lambda -- compose fixture/.ores-lambda.toml .ores/generated/lambda-ingress.toml > fixture/derived-compose.yaml
      - name: Retain lock and projection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-chat-lambda-authority-proof
          path: |
            fixture/Cargo.lock
            fixture/derived-compose.yaml
          if-no-files-found: error
          retention-days: 30
