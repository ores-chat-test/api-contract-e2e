name: codec negotiation certification

on:
  pull_request:
    paths:
      - rust-cert/**
      - .github/workflows/codec-negotiation-certification.yml
  push:
    branches:
      - main
    paths:
      - rust-cert/**
      - .github/workflows/codec-negotiation-certification.yml

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust-cert
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
